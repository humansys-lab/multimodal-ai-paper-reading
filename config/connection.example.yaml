# 教員・TA用の空様式。実際の設定は非公開で配布する。
# 接続・保持を検査し、API側の上限を教員が管理したうえで、記入済みの別ファイルをconnection.local.yamlとして個別配布する。
# 学生はこの見本を改名して使わない。Notebook 01・02の冒頭に受取り・読込み手順がある。
# APIキーはこのファイルにも書かず、Notebookの専用入力欄に入力する。
# 未確認の項目をpassへ変更して試験を省略しない。
runtime:
  schema_version: 1
  route: course_proxy
  api: responses
  model: null
  base_url: null
  allowed_base_urls: []
  sdk_version: null
  proxy_version: null
  timeout_seconds: 30
  max_retries: 0
  capabilities:
    input_kinds: []
    parameters: {}
    manual_history: false
  audit:
    verified_at: null
    evidence_id: null
    route_test: not_run
    budget_fail_closed: not_run
    retention_review: not_run
# 利用額・回数のhard limitは教員がAPI側で管理。Notebook内の許可ID・回数枠は不要。

# OpenAI直接接続のモデルはNotebookのmodel欄で採用3種から選ぶ。
# gpt-6-luna / gpt-6.1-sol / gpt-4.1-mini。モデルごとの実測はdocs/capability_audit.md。
# 中継の場合は選んだモデルと一致する、経路で確認した接続設定が必要。
