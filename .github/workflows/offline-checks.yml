name: Offline material checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q -m "not live"
      - run: uv run python scripts/check_course.py --mode structure
      - run: uv run python scripts/check_notebooks.py --execute-offline
      - run: uv run python scripts/check_public_release.py
      # 配布判定は別ゲート。草稿の単体試験をreadinessの代わりにしない。
